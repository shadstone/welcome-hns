name: Submit an HNS site
description: Suggest a Handshake-native destination for human review.
title: "[Site]: "
labels: [site-submission, needs-verification]
body:
  - type: input
    id: name
    attributes: { label: Native HNS name, placeholder: "example/" }
    validations: { required: true }
  - type: input
    id: punycode
    attributes: { label: ASCII/Punycode name, description: Required for Unicode or emoji names. }
  - type: input
    id: normal-url
    attributes: { label: Normal-browser companion URL }
  - type: dropdown
    id: category
    attributes:
      label: Category
      options: [Games and Fun, Community, Tools and Browsers, Identity and Profiles, Shops and Markets, Learning, Experimental]
    validations: { required: true }
  - type: textarea
    id: value
    attributes: { label: What visitors will find, description: Explain the site's purpose and why it is useful. }
    validations: { required: true }
  - type: checkboxes
    id: review
    attributes:
      label: Review acknowledgements
      options:
        - { label: I understand that submission does not guarantee inclusion., required: true }
        - { label: I understand that DNS, DANE, content, and ownership context will be checked., required: true }
