server {
  listen 80;
  listen [::]:80;
  server_name welcome www.welcome;
  root /opt/welcome-hns/current;
  index index.html;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location / {
    try_files $uri $uri/ =404;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name welcome www.welcome;
  root /opt/welcome-hns/current;
  index index.html;

  ssl_certificate /var/lib/handout/certs/welcome.crt;
  ssl_certificate_key /var/lib/handout/certs/welcome.key;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
